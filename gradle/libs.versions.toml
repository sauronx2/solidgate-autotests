[versions]
java = "25"
selenide = "7.19.0"
rest-assured = "6.1.0"
jackson = "3.2.3"
lombok = "1.18.48"
junit = "6.1.3"
assertj = "3.27.7"
awaitility = "4.3.0"
dotenv = "3.2.0"
slf4j = "2.0.20"

[libraries]
selenide = { module = "com.codeborne:selenide", version.ref = "selenide" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-suite = { module = "org.junit.platform:junit-platform-suite" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
dotenv = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
